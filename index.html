<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e9e4db">
  <title>Unit 1730 — Physics Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ── App Header ─────────────────────────────── -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-glyph">◈</span>
        <div class="brand-text">
          <span class="brand-unit">UNIT</span>
          <span class="brand-num">1730</span>
        </div>
      </div>
      <span class="header-date" id="header-date"></span>
    </div>
    <div class="header-line"></div>
  </header>

  <!-- ── App Body ────────────────────────────────── -->
  <div class="app-layout">

    <!-- ── Navigation ─────────────────────────────── -->
    <nav class="app-nav">
      <button class="nav-btn active" id="nav-plan" data-view="plan">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span class="nav-label">Curriculum</span>
      </button>
      <button class="nav-btn" id="nav-problems" data-view="problems">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="14" y2="12"/>
            <path d="M18 15l2 2 4-4" stroke-width="2"/>
            <line x1="4" y1="18" x2="12" y2="18"/>
          </svg>
        </span>
        <span class="nav-label">Problems</span>
      </button>
      <div class="nav-footer">
        <div class="nav-footer-label">45-WEEK PLAN</div>
        <div class="nav-footer-sub">EFT for Gravity</div>
      </div>
    </nav>

    <!-- ── Main Content ────────────────────────── -->
    <main class="app-main">

      <!-- View 1: Curriculum -->
      <section class="view active" id="view-plan">
        <div class="view-title-bar">
          <h2 class="view-title">Curriculum</h2>
        </div>
        <div class="progress-card" id="progress-card">
          <div class="progress-card-top">
            <div class="progress-card-left">
              <span class="prog-eyebrow">OVERALL PROGRESS</span>
              <span class="prog-count" id="prog-count">0 of 0 complete</span>
            </div>
            <span class="prog-pct" id="prog-pct">0%</span>
          </div>
          <div class="prog-track">
            <div class="prog-bar" id="prog-bar"></div>
          </div>
          <div class="prog-footer">
            <span class="prog-label-sm" id="prog-phase">Phase 0 — Diagnostic</span>
            <span class="prog-label-sm">45-week plan</span>
          </div>
        </div>
        <div class="curriculum-list" id="curriculum-list"></div>
      </section>

      <!-- View 2: Problem Sets -->
      <section class="view" id="view-problems">
        <div class="view-title-bar">
          <h2 class="view-title">Problem Sets</h2>
        </div>
        <div class="ps-filter-wrap">
          <div class="ps-filters" id="ps-filters"></div>
        </div>
        <div class="ps-list" id="ps-list"></div>
      </section>

    </main>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
